# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash


# JB: in order to have hugo accept html in md file
#markup:
#  goldmark:
#    renderer:
#      unsafe: true



jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Announce posts that opt in with `bluesky: true` in their front matter.
  #
  # Which posts have been announced is tracked in scripts/bluesky-announced.txt
  # (committed) rather than inferred from git history: a post is skipped only
  # once its announcement has actually succeeded and been recorded. A run that
  # fails therefore retries on the next push instead of being silently skipped
  # forever — which is how the MMLU post was lost.
  notify:
    runs-on: ubuntu-latest
    needs: deploy
    # Announce on a real push; a manual run from the Actions tab also retries
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Announce new posts on Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SITE_BASE_URL: https://bergstrom.org
        run: |
          set -euo pipefail
          MARKER="scripts/bluesky-announced.txt"
          touch "$MARKER"

          # Print "true"/"false" for a post's `bluesky:` front-matter flag
          bluesky_flag() {
            awk 'BEGIN{n=0} /^---[[:space:]]*$/{n++; if(n==2) exit; next} n==1{print}' \
              | sed -n 's/^bluesky:[[:space:]]*//p' \
              | head -n1 \
              | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]'
          }

          posted=0
          for file in content/posts/*.md; do
            [[ -f "$file" ]] || continue

            # Only act on posts that opted in with `bluesky: true`
            [[ "$(bluesky_flag < "$file")" == "true" ]] || continue

            slug="$(basename "$file" .md | tr '[:upper:]' '[:lower:]')"
            if grep -qxF "$slug" "$MARKER"; then
              echo "Already announced, skipping: $slug"
              continue
            fi

            echo "Announcing: $slug"
            ./scripts/post-to-bluesky.sh "$file"
            # Record immediately, so a later failure can't cause a re-post
            echo "$slug" >> "$MARKER"
            posted=$((posted + 1))
          done

          echo "Announced ${posted} post(s)."

      - name: Record announced posts
        if: always()
        run: |
          set -euo pipefail
          MARKER="scripts/bluesky-announced.txt"
          if [[ -z "$(git status --porcelain -- "$MARKER")" ]]; then
            echo "Nothing new to record."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MARKER"
          git commit -m "Record Bluesky announcements [skip ci]"
          git push