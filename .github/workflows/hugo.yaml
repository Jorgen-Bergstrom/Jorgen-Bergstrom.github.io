# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash


# JB: in order to have hugo accept html in md file
#markup:
#  goldmark:
#    renderer:
#      unsafe: true



jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Announce posts that newly opt in with `bluesky: true` in their front matter
  notify:
    runs-on: ubuntu-latest
    needs: deploy
    # Only announce on a real push, not on manual workflow dispatches
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is needed to compare the pushed range
          fetch-depth: 0

      - name: Announce new posts on Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SITE_BASE_URL: https://bergstrom.org
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Print the target URL and title for a post, or "true"/"false" for its flag
          bluesky_flag() {
            awk 'BEGIN{n=0} /^---[[:space:]]*$/{n++; if(n==2) exit; next} n==1{print}' \
              | sed -n 's/^bluesky:[[:space:]]*//p' \
              | head -n1 \
              | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]'
          }

          # On the very first push of a branch `before` is all zeros; fall back
          # to the parent commit so we only look at what actually changed.
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            if git rev-parse --verify --quiet "${AFTER_SHA}^" >/dev/null; then
              BEFORE_SHA="$(git rev-parse "${AFTER_SHA}^")"
            else
              echo "No previous commit to compare against; nothing to announce."
              exit 0
            fi
          fi

          echo "Comparing ${BEFORE_SHA}..${AFTER_SHA}"

          changed="$(git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$AFTER_SHA" -- 'content/posts/*.md')"
          if [[ -z "$changed" ]]; then
            echo "No post changes in this push."
            exit 0
          fi

          posted=0
          while IFS= read -r file; do
            [[ -z "$file" || ! -f "$file" ]] && continue

            # Only act on posts that opted in with `bluesky: true`
            new_flag="$(bluesky_flag < "$file")"
            [[ "$new_flag" == "true" ]] || continue

            # Skip if it was already opted in before this push, so later edits
            # to an already-announced post don't re-post it.
            old_flag="$(git show "${BEFORE_SHA}:${file}" 2>/dev/null | bluesky_flag || true)"
            if [[ "$old_flag" == "true" ]]; then
              echo "Already announced previously, skipping: $file"
              continue
            fi

            echo "Announcing: $file"
            ./scripts/post-to-bluesky.sh "$file"
            posted=$((posted + 1))
          done <<< "$changed"

          echo "Announced ${posted} post(s)."