baseURL: https://bergstrom.org/
languageCode: en-us
languageName: English
title: "Jorgen Bergstrom"
theme: LoveIt
copyright: Jorgen Bergstrom

enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true

# Allow raw HTML in markdown (needed for embedded video, etc.)
markup:
  goldmark:
    renderer:
      unsafe: true

# Home page also emits /index.json, which the lunr search on the site fetches.
# Without the JSON output the search box renders but returns nothing.
outputs:
  home: ["HTML", "RSS", "JSON"]

# pagination:
#   disableAliases: false
#   pagerSize: 10
#   path: "page"

params:
  app:
    # Home-screen / launcher label (theme default was "My cool site").
    title: "Jorgen Bergstrom"
    themeColor: "#ffffff"
    # Windows tile colour (theme default was an unrelated orange).
    tileColor: "#0160ea"
    # The theme emits a Safari pinned-tab <link> when this is set, but no
    # safari-pinned-tab.svg exists; leaving it empty suppresses the dead link.
    iconColor: ""
  defaultTheme: "light" # ["auto", "light", "dark"]
  dateFormat: "2006-01-02"
  title: "Polymer Mechanics and Machine Learning"
  description: "Material Models, Experimental Data, Machine Learning."
  images: ["JB5.jpeg"]
  author:
    name: 'Jorgen Bergstrom, PhD'
  header:
    desktopMode: "fixed" # desktop header mode ["fixed", "normal", "auto"]
    mobileMode: "auto" # mobile header mode ["fixed", "normal", "auto"]
    title:
      logo: '/megaphone-JB_03.webp'
      name: "Jorgen Bergstrom"
      pre: ""
      post: "" # you can add extra information after the name (HTML format is supported), such as icons
      typeit: false # whether to use typeit animation for title name
  footer:
    enable: true
    custom: ''
    hugo: false # whether to show Hugo and theme info
    copyright: true
    author: true
    since: 2025
    license: ''
  page:
    math:
      enable: true
      copyTex: true
      mhchem: true
    hiddenFromHomePage: false
    hiddenFromSearch: false
    twemoji: false
    lightgallery: false
    ruby: true
    fraction: true
    fontawesome: true
    linkToMarkdown: true
    rssFullText: false
    toc:
      enable: true
      keepStatic: false
      auto: true
    code:
      copy: true
      maxShownLines: 50
    mapbox:
      accessToken: ""
      lightStyle: "mapbox://styles/mapbox/light-v10?optimize=true"
      darkStyle: "mapbox://styles/mapbox/dark-v10?optimize=true"
      navigation: true
      geolocate: true
      scale: true
      fullscreen: true
    share:
      enable: false
      Twitter: true
      Linkedin: false
      Pinterest: false
      Tumblr: false
  search:
    enable: true
    type: "lunr" # client-side search over /index.json; no credentials needed
    contentLength: 4000 # max index length of the chunked content
    placeholder: "" # placeholder of the search bar
    maxResultLength: 10 # max number of results length
    snippetLength: 30 # snippet length of the result
    highlightTag: "em" # HTML tag name of the highlight part in results
    absoluteURL: false # whether to use the absolute URL based on the baseURL in search index
  # Number of articles on /posts/ before splitting into page/2, page/3, ...
  # The archive lists one line per article (grouped by year), so a high value
  # keeps everything on one page. Set to 100 to effectively never paginate.
  section:
    paginate: 50
  # Same value for taxonomy term pages (/tags/python/, /categories/...).
  list:
    paginate: 50
  # Number of posts listed per category card on /categories/ before the
  # "more >>" link appears (local override: layouts/taxonomy/terms.html).
  categoriesCardCount: 10
  home:
    rss: 10 # amount of RSS pages
    profile:
      enable: true
      gravatarEmail: "" # Gravatar Email for preferred avatar in home page
      avatarURL: "/JB5_avatar.webp" # 320px wide; the full JB5.jpeg is only used for link cards
      title: "Polymer Mechanics and Machine Learning" # title shown in home page (HTML format is supported)
      subtitle: "Material Models, Experimental Data, Machine Learning."

      typeit: true # whether to use typeit animation for subtitle
      social: true # whether to show social links
      disclaimer: "" # disclaimer (HTML format is supported)
    posts:
      enable: true
      paginate: 10 # special amount of posts in each home posts page
      defaultHiddenFromHomePage: false # replaced with hiddenFromHomePage in params.page, default behavior when you don't set "hiddenFromHomePage" in front matter
  social:
    GitHub: "Jorgen-Bergstrom"
    Linkedin: "JorgenSBergstrom"
    Bluesky:
      Weight: 4
      Url: "https://bsky.app/profile/jorgen9b.bsky.social"
      Title: "Bluesky"
      Icon:
        Src: "lib/simple-icons/icons/bluesky.svg"
    Instagram: ""
    Youtubelegacy: ""
    Youtubecustom: ""
    Youtubechannel: ""


menu:
  main:
    - weight: 1
      identifier: "posts"
      pre: ""
      post: ""
      name: "Posts"
      url: "/posts/"
      title: ""
    - weight: 2
      identifier: "tags"
      pre: ""
      post: ""
      name: "Tags"
      url: "/tags/"
      title: ""
    - weight: 3
      identifier: "categories"
      pre: ""
      post: ""
      name: "Categories"
      url: "/categories/"
      title: ""

